<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/dark_logo_wbg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://backend.spacetechs.net" />

    <!-- Critical resource hints -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="modulepreload" href="/src/App.tsx" />
    <link rel="preload" href="/images/dark_logo_wbg.png" as="image" />

    <!-- Critical CSS -->
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        transition: all 0.2s;
      }
      .menu-item-active {
        background-color: rgb(239 246 255);
        color: rgb(59 130 246);
      }
      .menu-item-inactive {
        color: rgb(107 114 128);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .flex {
        display: flex;
      }
      .items-center {
        align-items: center;
      }
      .justify-center {
        justify-content: center;
      }
      .h-screen {
        height: 100vh;
      }
      .h-8 {
        height: 2rem;
      }
      .w-8 {
        width: 2rem;
      }
      .rounded-full {
        border-radius: 9999px;
      }
      .border-b-2 {
        border-bottom-width: 2px;
      }
      .border-blue-600 {
        border-color: rgb(37 99 235);
      }
    </style>

    <title>SpaceTechs</title>
  </head>
  <body class="dark:bg-gray-900">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
